#
# nRF Cloud FOTA (Memfault release management) without observability.
# Use instead of no-memfault.conf. FOTA turns CONFIG_MEMFAULT on through Kconfig.memfault, which needs
# Memfault SDK 1.45.0: NCS v3.4.1 ships 1.40.1, so add a 1.45.0 module to EXTRA_ZEPHYR_MODULES.
#

CONFIG_SM_NRF_CLOUD_OBSERVABILITY=n
CONFIG_SM_NRF_CLOUD_FOTA=y
